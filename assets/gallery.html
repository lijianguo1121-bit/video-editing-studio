<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>剪辑模板库 · 20 套</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:720px;height:1280px;background:transparent;overflow:hidden;}
  #stage{
    position:absolute;inset:0;width:720px;height:1280px;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #footage{position:absolute;inset:0;width:720px;height:1280px;object-fit:cover;display:none;}
  body.preview #footage{display:block;}
  .g-layer{position:absolute;inset:0;pointer-events:none;}

  /* ---------------- shared beat atoms (skinned per template) --------------- */
  .g-twrap{position:absolute;left:0;right:0;bottom:150px;height:400px;}
  .g-tblock{position:absolute;left:0;right:0;bottom:0;text-align:center;visibility:hidden;opacity:0;}
  .g-ttl{position:relative;display:inline-block;}
  .g-in{display:inline-block;transform-origin:50% 50%;}
  .g-tag,.g-sub,.g-en{display:block;}
  .g-sub{transform-origin:50% 50%;}

  /* =========================================================================
     01 · CRT 复古数据终端
     ========================================================================= */
  #L_crt{font-family:"SF Mono",Menlo,Consolas,monospace;}
  .crt-scan{
    position:absolute;inset:-4px;
    background:repeating-linear-gradient(180deg,
      rgba(0,0,0,.30) 0px, rgba(0,0,0,.30) 1px, transparent 1px, transparent 4px);
  }
  .crt-vig{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% 50%, transparent 42%, rgba(0,0,0,.72) 100%),
      linear-gradient(180deg, rgba(4,16,9,.62), rgba(4,16,9,.34) 45%, rgba(4,16,9,.70));
  }
  .crt-tint{position:absolute;inset:0;background:rgba(18,58,34,.36);}
  .crt-rule{position:absolute;left:0;right:0;height:2px;background:#39FF88;opacity:.55;
    box-shadow:0 0 14px rgba(57,255,136,.9);}
  .crt-corner{
    position:absolute;font-size:20px;letter-spacing:2px;color:rgba(57,255,136,.92);
    text-shadow:0 0 10px rgba(57,255,136,.85);
  }
  .crt-box{
    display:inline-block;border:2px solid rgba(57,255,136,.85);
    padding:24px 34px 22px;background:rgba(3,14,8,.55);
    box-shadow:0 0 26px rgba(57,255,136,.28), inset 0 0 26px rgba(57,255,136,.10);
  }
  #L_crt .g-tag{font-size:20px;letter-spacing:4px;color:rgba(57,255,136,.75);margin-bottom:12px;}
  #L_crt .g-ttl{font-size:70px;font-weight:700;letter-spacing:2px;color:#EAFFF2;
    text-shadow:-1.6px 0 rgba(255,70,70,.55), 1.6px 0 rgba(70,190,255,.55), 0 0 18px rgba(57,255,136,.92);}
  #L_crt .g-sub{margin-top:16px;font-size:26px;letter-spacing:2px;color:rgba(57,255,136,.92);}
  .crt-caret{
    display:inline-block;width:20px;height:34px;background:#39FF88;vertical-align:-4px;
    margin-left:10px;box-shadow:0 0 14px rgba(57,255,136,.9);
  }

  /* =========================================================================
     02 · 复古胶片双语
     ========================================================================= */
  #L_retro{font-family:"Songti SC","STSong",Georgia,serif;}
  .rt-warm{position:absolute;inset:0;background:rgba(196,142,74,.26);}
  .rt-grain{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);
    opacity:.16;mix-blend-mode:overlay;}
  .rt-vig{position:absolute;inset:0;
    background:radial-gradient(105% 68% at 50% 46%, transparent 38%, rgba(28,16,8,.82) 100%);}
  .rt-bar{position:absolute;left:0;right:0;height:54px;background:rgba(12,9,6,.88);}
  .rt-perf{position:absolute;top:90px;bottom:90px;width:26px;display:flex;flex-direction:column;
    justify-content:space-around;align-items:center;}
  .rt-perf i{display:block;width:15px;height:19px;border-radius:3px;background:rgba(12,9,6,.72);}
  .rt-top{position:absolute;left:56px;right:56px;top:16px;display:flex;justify-content:space-between;
    font-size:20px;letter-spacing:3px;color:rgba(242,228,206,.92);}
  #L_retro .g-tag{font-size:19px;letter-spacing:6px;color:rgba(217,160,91,.98);margin-bottom:14px;}
  #L_retro .g-ttl{font-size:72px;font-weight:600;letter-spacing:3px;color:#F7EEDD;
    text-shadow:0 4px 18px rgba(20,10,4,.9);}
  #L_retro .g-sub{margin-top:16px;font-size:26px;letter-spacing:4px;color:rgba(247,238,221,.92);}
  #L_retro .g-en{margin-top:12px;font-size:19px;letter-spacing:7px;color:rgba(217,160,91,.95);}

  /* =========================================================================
     03 · 增长数据仪表盘
     ========================================================================= */
  #L_dash{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}
  .ds-veil{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(6,18,32,.86), rgba(6,18,32,.34) 40%,
      rgba(6,18,32,.42) 66%, rgba(6,18,32,.92) 100%);}
  .ds-glass{
    background:linear-gradient(158deg, rgba(16,44,68,.90), rgba(8,22,38,.94));
    border:1.4px solid rgba(79,209,224,.42);border-radius:22px;
    box-shadow:0 18px 44px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
  }
  .ds-top{position:absolute;left:36px;top:44px;display:flex;align-items:center;gap:12px;
    padding:14px 26px;border-radius:999px;font-size:24px;font-weight:600;letter-spacing:2px;
    color:#DFF6FF;background:rgba(8,24,40,.82);box-shadow:0 0 0 1.4px rgba(79,209,224,.45);}
  .ds-top .dot{width:13px;height:13px;border-radius:50%;background:#4FD1E0;}
  .ds-chart{position:absolute;left:36px;width:648px;top:938px;height:166px;padding:20px 24px 14px;}
  .ds-chart .cap{font-size:20px;letter-spacing:3px;color:rgba(79,209,224,.95);}
  .ds-chart svg{display:block;width:600px;height:104px;margin-top:8px;}
  .ds-kpi{position:absolute;left:36px;right:36px;top:1108px;display:flex;gap:14px;}
  .ds-kpi div{flex:1;padding:12px 16px 10px;}
  .ds-kpi .l{font-size:18px;line-height:1.2;color:rgba(200,226,240,.78);letter-spacing:1px;}
  .ds-kpi .v{font-family:"SF Mono",Menlo,monospace;font-size:34px;font-weight:700;color:#EAFBFF;
    letter-spacing:1px;line-height:1.15;}
  .ds-kpi .v small{font-size:19px;font-weight:600;color:rgba(79,209,224,.95);margin-left:3px;}
  .ds-kpi .d{font-size:17px;line-height:1.2;color:#A8E063;font-family:"SF Mono",Menlo,monospace;}
  .ds-ring{position:absolute;right:32px;top:44px;width:76px;height:76px;}
  #L_dash .g-twrap{bottom:358px;height:300px;}
  .ds-card{display:inline-block;padding:28px 36px 26px;border-radius:24px;text-align:center;
    background:linear-gradient(158deg, rgba(16,44,68,.94), rgba(8,22,38,.96));
    border:1.4px solid rgba(79,209,224,.5);
    box-shadow:0 20px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);}
  #L_dash .g-tag{font-size:20px;letter-spacing:5px;color:rgba(79,209,224,.95);margin-bottom:12px;}
  #L_dash .g-ttl{font-size:64px;font-weight:700;letter-spacing:2px;color:#EAFBFF;}
  #L_dash .g-sub{margin-top:14px;font-size:24px;letter-spacing:2px;color:rgba(200,226,240,.78);}

  /* =========================================================================
     04 · 财经研报纪要
     ========================================================================= */
  #L_report{font-family:"Songti SC","STSong",Georgia,serif;}
  .rp-paper{
    position:absolute;left:30px;width:660px;top:736px;
    background:rgba(250,249,244,.955);border-radius:6px;
    box-shadow:0 22px 52px rgba(0,0,0,.46);padding:26px 30px 24px;
  }
  .rp-head{position:absolute;left:36px;right:36px;top:44px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:21px;letter-spacing:3px;color:rgba(250,249,244,.94);}
  .rp-head b{font-size:26px;letter-spacing:4px;}
  .rp-kick{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:2.5px solid #14263A;padding-bottom:9px;}
  .rp-kick .n{font-size:29px;font-weight:700;letter-spacing:3px;color:#14263A;}
  .rp-kick .m{font-family:"SF Mono",Menlo,monospace;font-size:18px;color:#6B7887;letter-spacing:2px;}
  .rp-kick2{border-bottom:1px solid #C9CFD6;margin-top:5px;}
  .rp-tbl{margin-top:18px;}
  .rp-tr{display:flex;align-items:baseline;padding:11px 0;border-bottom:1px solid #E4E7EB;}
  .rp-tr .c1{flex:1;font-size:23px;color:#3A4A5C;letter-spacing:2px;}
  .rp-tr .c2{width:150px;text-align:right;font-family:"SF Mono",Menlo,monospace;
    font-size:25px;font-weight:700;color:#14263A;}
  .rp-tr .c3{width:110px;text-align:right;font-family:"SF Mono",Menlo,monospace;
    font-size:21px;color:#C7263C;}
  .rp-note{margin-top:14px;font-size:17px;color:#8894A2;letter-spacing:1px;font-family:"SF Mono",Menlo,monospace;}
  #L_report .g-twrap{position:relative;left:auto;right:auto;top:auto;bottom:auto;
    height:196px;margin-top:14px;text-align:left;}
  #L_report .g-tblock{top:0;bottom:auto;text-align:left;}
  #L_report .g-tag{font-size:19px;letter-spacing:5px;color:#C7263C;}
  #L_report .g-ttl{margin-top:8px;font-size:58px;font-weight:700;letter-spacing:2px;color:#14263A;}
  #L_report .g-sub{margin-top:12px;font-size:22px;letter-spacing:2px;color:#5A6A7C;
    border-top:1px solid #C9CFD6;padding-top:12px;}

  /* =========================================================================
     05 · 手写手账便签
     ========================================================================= */
  #L_journal{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",serif;}
  .jn-paper{position:absolute;inset:0;
    background:
      radial-gradient(rgba(160,132,88,.16) 1px, transparent 1.4px) 0 0/22px 22px,
      linear-gradient(180deg, rgba(247,239,221,.78), rgba(240,228,204,.30) 44%, rgba(233,218,190,.80));}
  .jn-tape{position:absolute;height:52px;background:rgba(214,190,140,.62);
    box-shadow:0 3px 12px rgba(120,96,52,.28);
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 6px, transparent 6px 13px);}
  .jn-sticky{
    position:absolute;width:214px;padding:18px 18px 22px;
    background:linear-gradient(170deg,#FFF3A8,#FFE873);
    box-shadow:0 12px 26px rgba(120,96,40,.34);
    font-family:"PingFang SC",sans-serif;font-size:25px;font-weight:700;color:#4A3A16;
    letter-spacing:1px;line-height:1.3;
  }
  .jn-sticky.p{background:linear-gradient(170deg,#FFD3C4,#FBB79E);color:#6B2E1E;}
  .jn-sticky.g{background:linear-gradient(170deg,#CFEBB6,#AEDD8B);color:#254A16;}
  .jn-clip{position:absolute;width:26px;height:64px;border:4px solid #9AA3AD;border-radius:13px;
    box-shadow:0 3px 8px rgba(0,0,0,.3);}
  #L_journal .g-twrap{bottom:150px;height:330px;}
  .jn-card{display:inline-block;padding:26px 40px 24px;background:rgba(255,253,246,.97);
    border-radius:10px;box-shadow:0 16px 34px rgba(120,96,52,.34);position:relative;
    border-bottom:1px dashed #D9C79E;}
  #L_journal .g-tag{font-size:22px;letter-spacing:4px;color:#B07A3C;}
  #L_journal .g-ttl{margin-top:10px;font-size:66px;font-weight:700;color:#2E2A24;letter-spacing:2px;
    background:linear-gradient(180deg, transparent 58%, rgba(255,233,107,.95) 58%);}
  #L_journal .g-sub{margin-top:16px;font-size:25px;color:#6A5E4C;letter-spacing:2px;}

  /* =========================================================================
     06 · 黑板粉笔讲解
     ========================================================================= */
  #L_chalk{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",cursive;}
  .ck-board{position:absolute;inset:0;background:rgba(24,52,44,.88);}
  .ck-tex{position:absolute;inset:0;opacity:.5;
    background:
      radial-gradient(rgba(255,255,255,.055) 1px, transparent 1.3px) 0 0/17px 17px,
      radial-gradient(rgba(255,255,255,.04) 1px, transparent 1.2px) 7px 9px/29px 29px;}
  .ck-vig{position:absolute;inset:0;
    background:radial-gradient(112% 74% at 50% 48%, transparent 34%, rgba(6,18,14,.80) 100%);}
  .ck-frame{position:absolute;inset:26px;border:5px solid rgba(120,86,52,.85);border-radius:8px;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);}
  .ck-head{position:absolute;left:60px;top:66px;font-size:26px;letter-spacing:4px;
    color:rgba(242,245,240,.92);text-shadow:0 0 12px rgba(255,255,255,.35);}
  .ck-dust{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);}
  .ck-circle{position:absolute;left:66px;top:868px;width:588px;height:222px;}
  .ck-ul{position:absolute;left:70px;right:70px;top:1104px;height:14px;}
  #L_chalk .g-twrap{bottom:172px;height:340px;}
  #L_chalk .g-tag{font-size:24px;letter-spacing:6px;color:#FFD86B;}
  #L_chalk .g-ttl{margin-top:12px;font-size:70px;font-weight:700;color:#F4F7F2;letter-spacing:3px;
    text-shadow:0 0 2px rgba(255,255,255,.9), 0 0 22px rgba(255,255,255,.42);}
  #L_chalk .g-sub{margin-top:16px;font-size:27px;letter-spacing:3px;color:#8FD3FF;
    text-shadow:0 0 16px rgba(143,211,255,.55);}

  /* =========================================================================
     07 · 电商促销大字报
     ========================================================================= */
  #L_promo{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}
  .pm-bg{position:absolute;inset:0;
    background:
      radial-gradient(rgba(255,255,255,.30) 3px, transparent 3.4px) 0 0/34px 34px,
      linear-gradient(180deg, rgba(232,38,43,.28), rgba(14,36,52,.28) 45%, rgba(232,38,43,.42));}
  .pm-top{position:absolute;left:-30px;right:-30px;top:0;height:150px;
    background:linear-gradient(96deg,#C81E24,#ED2B31 52%,#C81E24);
    transform:rotate(-2.2deg);transform-origin:0 0;
    box-shadow:0 14px 34px rgba(0,0,0,.42);}
  .pm-top .t{position:absolute;left:56px;right:56px;top:44px;text-align:center;color:#fff;
    font-size:42px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 0 rgba(0,0,0,.20);}
  .pm-top .s{position:absolute;left:56px;right:56px;top:98px;text-align:center;color:rgba(255,255,255,.9);
    font-size:21px;font-weight:700;letter-spacing:7px;}
  .pm-slash{position:absolute;left:-40px;right:-40px;height:66px;
    background:linear-gradient(96deg,#FFD400,#FFE45C 55%,#FFD400);
    transform:rotate(-2.2deg);box-shadow:0 12px 28px rgba(0,0,0,.34);}
  .pm-slash .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#0E2434;font-size:33px;font-weight:900;letter-spacing:6px;}
  .pm-burst{position:absolute;right:34px;top:640px;width:186px;height:186px;}
  .pm-burst .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:46px;font-weight:900;color:#0E2434;letter-spacing:2px;}
  #L_promo .g-twrap{bottom:132px;height:330px;}
  .pm-slab{display:inline-block;padding:22px 34px 26px;border-radius:14px;
    background:linear-gradient(160deg,#FFD400,#FFC200);
    box-shadow:0 18px 40px rgba(0,0,0,.44);}
  #L_promo .g-tag{display:inline-block;font-size:23px;font-weight:900;letter-spacing:4px;color:#fff;
    background:#E8262B;border-radius:8px;padding:6px 16px 8px;margin-bottom:12px;}
  #L_promo .g-ttl{font-size:86px;font-weight:900;letter-spacing:4px;color:#fff;
    -webkit-text-stroke:5px #0E2434;
    text-shadow:0 7px 0 rgba(14,36,52,.28);}
  #L_promo .g-sub{margin-top:14px;font-size:25px;font-weight:900;letter-spacing:5px;color:#0E2434;}

  /* =========================================================================
     08 · 弹幕评论流
     ========================================================================= */
  #L_danmu{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}
  .dm-veil{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(6,8,16,.80), rgba(6,8,16,.30) 36%,
      rgba(6,8,16,.34) 62%, rgba(6,8,16,.90) 100%);}
  .dm-live{position:absolute;left:32px;top:44px;display:flex;align-items:center;gap:12px;
    padding:13px 26px;border-radius:999px;background:rgba(232,38,43,.94);
    font-size:24px;font-weight:800;letter-spacing:3px;color:#fff;
    box-shadow:0 0 26px rgba(232,38,43,.6);}
  .dm-live .dot{width:13px;height:13px;border-radius:50%;background:#fff;}
  .dm-online{position:absolute;right:32px;top:52px;font-size:23px;font-weight:700;letter-spacing:2px;
    color:rgba(234,251,255,.94);text-shadow:0 0 12px rgba(34,229,255,.7);}
  .dm-lane{position:absolute;left:0;white-space:nowrap;will-change:transform;}
  .dm-lane span{display:inline-block;padding:11px 22px;border-radius:999px;
    font-size:26px;font-weight:600;letter-spacing:1px;color:#fff;
    background:rgba(10,14,26,.42);border:1.4px solid rgba(255,255,255,.42);
    text-shadow:0 2px 5px rgba(0,0,0,.75);}
  .dm-lane.hi span{background:rgba(232,38,43,.72);border-color:rgba(255,255,255,.7);}
  .dm-bar{position:absolute;left:36px;right:36px;bottom:40px;display:flex;gap:18px;}
  .dm-bar div{flex:1;text-align:center;padding:13px 0 14px;border-radius:16px;
    background:rgba(10,14,26,.62);border:1.4px solid rgba(34,229,255,.34);
    font-size:23px;font-weight:700;letter-spacing:1px;color:rgba(234,251,255,.95);}
  #L_danmu .g-twrap{bottom:190px;height:340px;text-align:left;}
  #L_danmu .g-tblock{text-align:left;padding-left:38px;}
  #L_danmu .g-tag{display:inline-block;font-size:22px;font-weight:800;letter-spacing:3px;color:#fff;
    background:rgba(232,38,43,.92);border-radius:8px;padding:5px 15px 7px;}
  #L_danmu .g-ttl{margin-top:12px;font-size:68px;font-weight:900;letter-spacing:3px;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.6), 0 0 24px rgba(34,229,255,.6);}
  #L_danmu .g-sub{margin-top:14px;font-size:25px;letter-spacing:3px;color:rgba(234,251,255,.92);
    text-shadow:0 2px 6px rgba(0,0,0,.7);}

  /* =========================================================================
     09 · 杂志编辑排版
     ========================================================================= */
  #L_magazine{font-family:"Songti SC","STSong",Georgia,serif;}
  .mg-paper{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(245,242,233,.80), rgba(245,242,233,.42) 42%,
      rgba(245,242,233,.90) 100%);}
  .mg-head{position:absolute;left:46px;right:46px;top:48px;}
  .mg-head .r{display:flex;justify-content:space-between;align-items:baseline;}
  .mg-head .np{font-size:27px;letter-spacing:8px;color:#102A3A;}
  .mg-head .is{font-family:"SF Mono",Menlo,monospace;font-size:18px;letter-spacing:3px;color:#6B7887;}
  .mg-head .ln{height:1.6px;background:#102A3A;margin-top:11px;}
  .mg-head .ln2{height:1px;background:rgba(16,42,58,.35);margin-top:4px;}
  .mg-num{position:absolute;left:auto;right:40px;bottom:400px;font-size:112px;font-weight:300;line-height:.9;
    letter-spacing:-3px;color:#102A3A;font-family:"SF Mono",Menlo,monospace;}
  .mg-rule{position:absolute;left:46px;top:842px;width:180px;height:2.4px;background:#102A3A;}
  .mg-cap{position:absolute;left:46px;bottom:44px;font-family:"SF Mono",Menlo,monospace;
    font-size:17px;letter-spacing:3px;color:#6B7887;line-height:1.7;}
  .mg-guide{position:absolute;right:64px;top:220px;bottom:250px;width:1px;background:rgba(16,42,58,.24);}
  #L_magazine .g-twrap{bottom:190px;height:330px;text-align:left;}
  #L_magazine .g-tblock{text-align:left;padding-left:46px;}
  #L_magazine .g-tag{font-family:"SF Mono",Menlo,monospace;font-size:18px;letter-spacing:5px;color:#C7263C;}
  #L_magazine .g-ttl{margin-top:16px;font-size:78px;font-weight:300;letter-spacing:6px;color:#102A3A;}
  #L_magazine .g-sub{margin-top:18px;font-size:23px;letter-spacing:4px;color:#5A6A7C;}
  #L_magazine .g-en{margin-top:10px;font-family:"SF Mono",Menlo,monospace;font-size:16px;
    letter-spacing:4px;color:#8894A2;}

  /* =========================================================================
     10 · 极简纪录片章节
     ========================================================================= */
  #L_minimal{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;}
  .mn-veil{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(14,16,18,.62), rgba(14,16,18,.12) 38%,

const MODE   = params.get('mode')  || 'overlay';

const STAGE_H = stage.clientHeight || 1280;

   from it (see preview10.py) so the page also works straight off the disk. */
let CFG = (window.__TPL && window.__TPL.beats) ? window.__TPL : FALLBACK;

if (MODE === 'preview' && src) {
  document.body.classList.add('preview');
  document.getElementById('footage').src = src;

const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ease = p => { p = clamp01(p); return p * p * (3 - 2 * p); };
const seg = (t, a, b) => t >= a && t < b;
function sp(p, z = 0.66, w = 15) {
  p = Math.max(0, p); if (p === 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * p) * (Math.cos(wd * p) + (z * w / wd) * Math.sin(wd * p));
}
function beatAt(t, C) {
  let i = 0;
  for (let k = 0; k < C.beats.length; k++) if (t >= C.beats[k].t0) i = k;
  return i;
}
function rnd(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

/* shared headline: 5 blocks, one per spoken beat ------------------------- */
function mkBeats(host, C, o) {
  o = o || {};
  const wrap = el('div', o.wrap || 'g-twrap');
  const items = C.beats.map(b => {
    const box  = el('div', 'g-tblock');
    const tag  = el('div', 'g-tag', b.tag);
    const ttl  = el('div', 'g-ttl');
    const inn  = el('span', 'g-in', b.title);
    ttl.appendChild(inn);
    box.appendChild(tag); box.appendChild(ttl);
    box.appendChild(el('div', 'g-sub', b.sub));
    if (o.en) box.appendChild(el('div', 'g-en', b.en));
    wrap.appendChild(box);
    return { box, inn };
  });
  host.appendChild(wrap);
  return { wrap, items };
}
function showBeats(items, t, C, rise, sf) {
  const i = beatAt(t, C);
  items.forEach((it, k) => {
    if (k !== i) { it.box.style.visibility = 'hidden'; it.box.style.opacity = '0'; return; }
    const b = C.beats[k], p = t - b.t0;
    const out = clamp01((b.t1 - t) / 0.34);
    const e = sp(p / (sf || 0.60), 0.68, 16);
    it.box.style.visibility = 'visible';
    it.box.style.opacity = (clamp01(p / 0.16) * out).toFixed(3);
    it.box.style.transform =
      `translateY(${((1 - e) * (rise == null ? 46 : rise)).toFixed(2)}px) scale(${(0.92 + 0.08 * e).toFixed(4)})`;
  });
  return i;
}
function fitBeats(items, maxW) {
  items.forEach(it => {
    it.inn.style.transform = '';
    const w = it.inn.getBoundingClientRect().width;
    if (w > maxW) it.inn.style.transform = `scale(${(maxW / w).toFixed(4)})`;
  });
}
/* share one headline skin class on the block container */
function skinBeats(items, cls) {
  items.forEach(it => {
    const c = it.box.querySelector('.g-ttl');
    const d = document.createElement('div');
    d.className = cls;
    it.box.insertBefore(d, c);
    d.appendChild(c);
    const sq = it.box.querySelector('.g-sub');
    d.appendChild(sq);
  });
}

/* ================= shared insert-image layer ============================ */
/* One implementation, used by every skin: shows CFG.images[k] from its own
   timestamp until the next one, inside a soft safe-area card, so the spoken
   face in the middle of the frame is never covered. */
/* 位置用「锚点 + 边距」描述，卡片尺寸变了也自动贴合，不用重算坐标。
   竖屏口播里标题卡永远在画面中下部，所以默认位置选在人物两侧的腰部空档，
   既不压脸也不压标题。 */
const IMG_ANCHOR = {
  tl: [0, 0], tr: [1, 0], bl: [0, 1], br: [1, 1],
  ml: [0, 0.30], mr: [1, 0.30],
  top: [0.5, 0], bottom: [0.5, 1], center: [0.5, 0.5],
};
const IMG_MARGIN = 18;

function imgXY(pos, w, h) {
  const a = IMG_ANCHOR[pos] || IMG_ANCHOR.ml;
  let x = a[0] * (STAGE_W - w);
  let y = a[1] * (STAGE_H - h);
  if (a[0] === 0) x += IMG_MARGIN;
  if (a[0] === 1) x -= IMG_MARGIN;
  if (a[1] === 0) y += IMG_MARGIN;
  if (a[1] === 1) y -= IMG_MARGIN;
  return [Math.round(x), Math.round(y)];
}

function mkImgLayer(host, C) {
  /* 每套模板可以覆盖全局默认（位置 / 尺寸 / 透明度），
     因为各套版面不同 —— 标题在下的该走上方，顶部有标题栏的就得另想办法。 */
  const per = ((C.styles || []).find(s => s.id === STYLE) || {}).imageLayer || {};
  const cfg = Object.assign({}, C.imageLayer || {}, per);
  const plan = (Array.isArray(C.images) ? C.images : []).filter(x => x && x.file);
  if (cfg.enabled === false || !plan.length) return null;

  const wrap = el('div', 'g-imglayer');
  const sz = (Array.isArray(cfg.size) && cfg.size.length === 2)
    ? cfg.size.map(Number) : [180, 240];
  /* 优先用逐套微调好的绝对落点（templates.json 里算出来的），
     没有才退回锚点名。 */
  const pos = (Array.isArray(cfg.xy) && cfg.xy.length === 2)
    ? [Math.round(Number(cfg.xy[0])), Math.round(Number(cfg.xy[1]))]
    : imgXY(cfg.pos || 'bl', sz[0], sz[1]);
  const cards = plan.map(p => {
    const c = el('div', 'g-imgcard');
    /* 已经做成 B-roll 画中画的那几张，不再重复出一张小卡 */
    c.dataset.pip = ((C.camera && C.camera.pips) || []).some(x => x.i === p.idx) ? '1' : '';
    const im = el('img');
    im.src = p.file;
    const v = p.variant || {};
    im.style.objectPosition = v.pos || '50% 50%';
    let tr = 'scale(' + Number(v.zoom || 1).toFixed(3) + ')';
    if (v.flip) tr += ' scaleX(-1)';
    im.style.transform = tr;
    im.onerror = () => { c.style.display = 'none'; c.dataset.dead = '1'; };
    c.appendChild(im);
    c.style.width = sz[0] + 'px';
    c.style.height = sz[1] + 'px';
    c.style.left = pos[0] + 'px';
    c.style.top = pos[1] + 'px';
    wrap.appendChild(c);
    return c;
  });
  host.appendChild(wrap);

  const starts = plan.map(p => Math.max(0, Number(p.t) || 0));
  if (starts.length) starts[0] = 0;
  return { cards, starts, dur: Number(C.duration) || 20,
           base: Number(cfg.opacity) > 0 ? Number(cfg.opacity) : 0.88 };
}

function drawImgLayer(L, t) {
  if (!L) return;
  const { cards, starts, dur, base } = L;
  for (let k = 0; k < cards.length; k++) {
    const c = cards[k];
    if (c.dataset.dead) continue;
    if (c.dataset.pip === '1') {
      if (c.style.display !== 'none') c.style.display = 'none';
      continue;
    }
    const t0 = starts[k];
    const t1 = k + 1 < starts.length ? starts[k + 1] : dur;
    let o = 0, local = 0;
    if (t >= t0 && t < t1) {
      const span = Math.max(0.12, t1 - t0);
      o = Math.min(clamp01((t - t0) / 0.5), clamp01((t1 - t) / 0.5));
      local = (t - t0) / span;
    }
    if (o <= 0.004) { if (c.style.display !== 'none') c.style.display = 'none'; continue; }
    c.style.display = 'block';
    const sc = 1.02 + 0.07 * local;
    const dy = (0.5 - local) * 10;
    /* 圆圈画中画期间 B-roll 已经在铺图了，卡片和圆圈用的是同一个落点，
       会正好压在圆圈上把脸挡住 —— 所以跟着 B-roll 的浓度一起淡出。 */
    const yld = 1 - Math.min(1, window.__BROLLOP || 0);
    if (yld <= 0.004) { c.style.display = 'none'; continue; }
    c.style.opacity = (o * base * yld).toFixed(3);
    c.style.transform = 'translate3d(0,' + dy.toFixed(2) + 'px,0) scale(' + sc.toFixed(4) + ')';
  }
}

/* ================= B-roll + 圆圈画中画 ================================== */
/* 和 camera.py 共用同一份关键帧：k 是画面缩放，(x,y) 是"人脸锚点"该落在屏幕
   的哪。ffmpeg 侧照这份缩放 / 搬位主画面，这里照同一份算圆洞的位置与半径。 */
function sm01(p) { p = p < 0 ? 0 : (p > 1 ? 1 : p); return p * p * (3 - 2 * p); }

function camAt(cam, t) {
  const segs = cam.segs || [];
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (t < s.t1 || i === segs.length - 1) {
      let p = (t - s.t0) / Math.max(1e-6, s.t1 - s.t0);
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      const e = s.ease === 'smooth' ? sm01(p) : p;
      return { k: s.k0 + (s.k1 - s.k0) * e,
               x: s.x0 + (s.x1 - s.x0) * e,
               y: s.y0 + (s.y1 - s.y0) * e };
    }
  }
  const a = cam.anchor || [360, 400];
  return { k: 1, x: a[0], y: a[1] };
}

function mkBroll(stage, C) {
  const cam = C.camera;
  if (!cam || !Array.isArray(cam.pips) || !cam.pips.length) return null;
  const wrap = el('div', 'g-broll');
  const items = cam.pips.map(p => {
    const box = el('div', 'g-brollitem');
    const im = el('img');
    im.src = p.image;
    const rec = { box: box, im: im, p: p, dead: false };
    im.onerror = () => { rec.dead = true; box.style.display = 'none'; };
    box.appendChild(im);
    wrap.appendChild(box);
    return rec;
  });
  const ring = el('div', 'g-pipring');
  stage.insertBefore(wrap, stage.firstChild);      /* 压在模板层下面 */
  stage.appendChild(ring);                        /* 圆环在模板层上面 */
  return { wrap: wrap, items: items, ring: ring, cam: cam, lastMask: '' };
}

function drawBroll(B, t) {
  if (!B) return;
  const cam = B.cam;
  const c = camAt(cam, t);
  const maxHole = (cam.inset || 300) * c.k * 0.995;   /* 缩略画面的内切圆半径 */
  let hole = maxHole, op = 0, ringOp = 0;

  for (let i = 0; i < B.items.length; i++) {
    const it = B.items[i];
    if (it.dead) continue;
    const p = it.p, lead = p.lead || 0.35, tr = p.tr || 0.55;
    const a0 = p.t0 - lead, a1 = p.t1 + lead;
    let o = 0;
    if (t >= a0 && t <= a1) o = Math.min(sm01((t - a0) / 0.22), sm01((a1 - t) / 0.22));
    if (o <= 0.004) {
      if (it.box.style.display !== 'none') {
        it.box.style.display = 'none';
        it.box.style.opacity = 0;
      }
      continue;
    }
    if (it.box.style.display !== 'block') it.box.style.display = 'block';
    it.box.style.opacity = o.toFixed(3);
    const local = Math.max(0, Math.min(1, (t - p.t0) / Math.max(0.3, p.t1 - p.t0)));
    it.im.style.transform = 'translate3d(' + ((0.5 - local) * 14).toFixed(2) + 'px,0,0) '
                          + 'scale(' + (1.06 + 0.07 * local).toFixed(4) + ')';

    if (o > op) {
      op = o;
      /* 圆洞倍率：出现前收到内切圆，然后一路收到目标半径 */
      const rF = Math.max(0.12, p.r / Math.max(1, (cam.inset || 300) * (p.k || c.k) * 0.995));
      let f;
      if (t < p.t0) f = 8 + (1 - 8) * sm01((t - a0) / Math.max(0.01, p.t0 - a0));
      else if (t < p.t0 + tr) f = 1 + (rF - 1) * sm01((t - p.t0) / Math.max(0.01, tr));
      else if (t < p.t1 - tr) f = rF;
      else if (t < p.t1) f = rF + (1 - rF) * sm01((t - (p.t1 - tr)) / Math.max(0.01, tr));
      else f = 1 + (8 - 1) * sm01((t - p.t1) / Math.max(0.01, lead));
      const h = maxHole * f;
      if (h < hole) hole = h;
      ringOp = Math.max(ringOp,
                        Math.max(0, Math.min(1, (p.r * 1.75 - h) / (p.r * 0.75))) * o);
    }
  }

  if (op <= 0.004) {
    window.__BROLLOP = 0;
    if (B.wrap.style.display !== 'none') {
      B.wrap.style.display = 'none';
      B.ring.style.opacity = 0;
    }
    return;
  }
  window.__BROLLOP = op;                    /* 配图层据此避让（见 drawImgLayer） */
  if (B.wrap.style.display !== 'block') B.wrap.style.display = 'block';

  const mask = 'radial-gradient(circle at ' + c.x.toFixed(1) + 'px ' + c.y.toFixed(1) + 'px,'
    + 'rgba(0,0,0,0) 0,rgba(0,0,0,0) ' + Math.max(0, hole - 2.2).toFixed(1) + 'px,'
    + 'rgba(0,0,0,1) ' + hole.toFixed(1) + 'px)';
  if (mask !== B.lastMask) {
    B.lastMask = mask;
    B.wrap.style.maskImage = mask;
    B.wrap.style.webkitMaskImage = mask;
  }
  B.ring.style.opacity = ringOp.toFixed(3);
  B.ring.style.width = (hole * 2).toFixed(1) + 'px';
  B.ring.style.height = (hole * 2).toFixed(1) + 'px';
  B.ring.style.left = (c.x - hole).toFixed(1) + 'px';
  B.ring.style.top = (c.y - hole).toFixed(1) + 'px';
}

/* ============================== bootstrap =============================== */
const T = S[STYLE];
if (!T) throw new Error('unknown template: ' + STYLE);

function boot() {
  const layer = el('div', 'g-layer');
  layer.id = 'L_' + STYLE;
  stage.appendChild(layer);
  T.host = layer;
  T.build(layer, CFG);
  /* B-roll 必须压在模板层下面，所以先建它；圆环再单独挂到最上面一层 */
  const BR = mkBroll(stage, CFG);
  const IMG = mkImgLayer(stage, CFG);
  window.render = function (t) {
    T.draw(t, CFG);
    drawBroll(BR, t);
    drawImgLayer(IMG, t);
  };
  document.fonts.ready.then(() => {
    if (T.fit) T.fit(CFG);
    window.ready = true;
  });
}

boot();</script>
</body>
